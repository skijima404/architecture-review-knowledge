[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miro-to-failure-model"
version = "0.1.0"
description = "Miro-to-Failure-Model conversion pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Architecture Review Team" }
]
keywords = ["miro", "markdown", "backcasting", "failure-model", "architecture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]
miro = [
    "miro-api>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.urls]
Documentation = "docs/"
Repository = "https://github.com/your-org/architecture-review-knowledge"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"


